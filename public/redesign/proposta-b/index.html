<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Tá na Cara! — Proposta B: Playground Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <meta property="og:title" content="Tá na Cara! — O jogo da galera" />
  <meta property="og:description" content="Adivinhe quem é o personagem antes do seu oponente! Entre em uma sala rápida agora." />
  <meta property="og:type" content="game" />
  <meta property="og:image" content="https://tanacara.online/logo-horizontal.svg" />
  <meta name="theme-color" content="#F1F5F9" />

  <style>
    :root {
      --bg-canvas: #F1F5F9;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-faint: #94A3B8;
      --border-subtle: #E2E8F0;
      --border-card: #CBD5E1;
      
      /* Paleta Playground Gartic: Menta Vívida + Laranja Lupa + Azul Sala */
      --btn-play: #10B981;
      --btn-play-hover: #059669;
      --btn-play-shadow: #047857;
      
      --accent-orange: #EA580C;
      --accent-orange-tint: #FFEDD5;
      --accent-sky: #0284C7;
      --accent-sky-tint: #E0F2FE;

      --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Barra Superior com Status "Ao Vivo" */
    header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border-subtle);
      padding: 12px 20px;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-icon {
      width: 34px;
      height: 34px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: #065F46;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
      animation: pulseGreen 1.6s infinite;
    }

    /* Container Principal */
    main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar Interativo Estilo Gartic */
    .avatar-centerpiece {
      margin-bottom: 20px;
      text-align: center;
      position: relative;
    }

    .avatar-frame {
      width: 88px;
      height: 88px;
      border-radius: 28px;
      background: #FEF3C7;
      border: 3px solid #F59E0B;
      box-shadow: 0 6px 0 #D97706;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      overflow: hidden;
    }

    .avatar-frame:hover {
      transform: scale(1.05);
    }

    .avatar-frame:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #D97706;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-reroll-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--text-main);
      color: #FFFFFF;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .player-name-field {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-name-field input {
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      background: transparent;
      border: 1px dashed transparent;
      border-radius: var(--radius-sm);
      text-align: center;
      padding: 4px 10px;
      outline: none;
      transition: all 0.15s ease;
      width: 180px;
    }

    .player-name-field input:focus,
    .player-name-field input:hover {
      border-color: var(--border-card);
      background: #FFFFFF;
    }

    /* Card Central com 1 CTA Primário */
    .hub-card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      box-shadow: 0 4px 0 #CBD5E1;
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
    }

    /* O BOTÃO HERÓI DE ENTRADA RÁPIDA */
    .btn-quick-play {
      width: 100%;
      height: 60px;
      background: var(--btn-play);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.04em;
      border: 2px solid var(--btn-play-hover);
      border-radius: var(--radius-md);
      box-shadow: 0 5px 0 var(--btn-play-shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.1s ease;
      user-select: none;
    }

    .btn-quick-play:hover {
      background: var(--btn-play-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 0 var(--btn-play-shadow);
    }

    .btn-quick-play:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--btn-play-shadow);
    }

    /* Alternador Secundário de Abas Limpas */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-tab {
      background: #F8FAFC;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-tab:hover {
      border-color: var(--text-main);
      color: var(--text-main);
      background: #FFFFFF;
    }

    /* Ticker Social / Feed de Partidas Recentes */
    .feed-ticker {
      margin-top: 20px;
      background: #F8FAFC;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .feed-ticker strong {
      color: var(--text-main);
    }

    /* Lista Visual de Temas da Comunidade (O diferencial em destaque) */
    .theme-shelf {
      margin-top: 28px;
      width: 100%;
    }

    .shelf-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .theme-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      color: inherit;
    }

    .theme-card:hover {
      border-color: var(--accent-orange);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .theme-badge {
      font-size: 22px;
      margin-bottom: 4px;
      display: block;
    }

    .theme-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-main);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-count {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Modal Rápido */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border: 2px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: var(--text-main);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- Topo com Status Social -->
  <header>
    <div class="header-inner">
      <a href="#" class="brand-wrap">
        <img src="../../logo-icon.svg" alt="Tá na Cara" class="brand-icon" />
        <span class="brand-title">tá na cara!</span>
      </a>

      <!-- Prova Social Ao Vivo Estilo Gartic -->
      <div class="live-badge" title="Jogadores online em partidas públicas e privadas">
        <span class="live-dot"></span>
        <span>184 jogando agora</span>
      </div>
    </div>
  </header>

  <!-- Corpo Principal -->
  <main>
    
    <!-- Avatar Clicável com Reroll -->
    <div class="avatar-centerpiece">
      <div class="avatar-frame" id="avatarPicker" title="Clique para trocar de rosto">
        <img src="../../standard-faces/joao.jpg" alt="Avatar" class="avatar-img" id="avatarImg" />
        <div class="avatar-reroll-badge">🎲</div>
      </div>

      <div class="player-name-field">
        <input type="text" id="nicknameInput" value="Jogador_Top" maxlength="15" title="Seu apelido no jogo" />
      </div>
    </div>

    <!-- Hub Card Principal -->
    <div class="hub-card">
      
      <!-- O ÚNICO CTA HERO DOMINANTE -->
      <button class="btn-quick-play" id="btnQuickPlay">
        <span>⚡ JOGAR AGORA</span>
        <span style="font-size: 12px; font-weight: 700; opacity: 0.85;">(Partida Rápida)</span>
      </button>

      <!-- Alternador de Ações Claras -->
      <div class="mode-tabs">
        <button class="btn-tab" id="btnCreatePrivate">
          <span>👥 Criar com Amigo</span>
        </button>
        <button class="btn-tab" id="btnJoinTicket">
          <span>🎟️ Entrar com Código</span>
        </button>
      </div>

      <!-- Feed Dinâmico Social -->
      <div class="feed-ticker">
        <span>🏆</span>
        <span>Partida recente: <strong>Bia</strong> acertou o <em>Renato Cariani</em> contra <strong>Marcos</strong>!</span>
      </div>

    </div>

    <!-- Prateleira de Baralhos em Alta (O grande diferencial) -->
    <div class="theme-shelf">
      <div class="shelf-title">
        <span>🔥 Baralhos Mais Jogados Hoje</span>
        <a href="#" style="color: var(--accent-orange); text-decoration: none; font-weight: 700;">Ver todos →</a>
      </div>

      <div class="theme-grid">
        <div class="theme-card" onclick="startWithTheme('Políticos BR')">
          <span class="theme-badge">🏛️</span>
          <span class="theme-name">Políticos BR</span>
          <span class="theme-count">30 personalidades</span>
        </div>

        <div class="theme-card" onclick="startWithTheme('Craques da Bola')">
          <span class="theme-badge">⚽</span>
          <span class="theme-name">Craques 2026</span>
          <span class="theme-count">24 jogadores</span>
        </div>

        <div class="theme-card" onclick="startWithTheme('Streamers & Youtubers')">
          <span class="theme-badge">🎮</span>
          <span class="theme-name">Streamers BR</span>
          <span class="theme-count">18 criadores</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal Inserir Código -->
  <div class="modal-overlay" id="codeModal">
    <div class="modal-box">
      <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 8px;">Entrar em Sala</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        Digite o código de 6 números que seu amigo te passou:
      </p>

      <input 
        type="text" 
        id="ticketCodeInput"
        inputmode="numeric"
        maxlength="6"
        placeholder="Ex: 489201"
        style="width: 100%; font-family: inherit; font-size: 24px; font-weight: 900; letter-spacing: 0.25em; text-align: center; padding: 12px; border: 2px solid var(--border-card); border-radius: var(--radius-md); outline: none; margin-bottom: 16px;"
      />

      <div style="display: flex; gap: 8px;">
        <button id="btnCancelModal" style="flex: 1; padding: 12px; border: 1.5px solid var(--border-card); background: #F8FAFC; border-radius: var(--radius-md); font-weight: 700; cursor: pointer;">Cancelar</button>
        <button id="btnConfirmCode" style="flex: 1; padding: 12px; border: none; background: var(--text-main); color: #FFF; border-radius: var(--radius-md); font-weight: 800; cursor: pointer;">Entrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const faces = [
      '../../standard-faces/Ana.jpg',
      '../../standard-faces/Bruno.jpg',
      '../../standard-faces/Carla.jpg',
      '../../standard-faces/Davi.jpg',
      '../../standard-faces/Elisa.jpg',
      '../../standard-faces/Felipe.jpg',
      '../../standard-faces/joao.jpg',
      '../../standard-faces/katia.jpg'
    ];

    let currentFaceIdx = 6;
    const avatarImg = document.getElementById('avatarImg');
    const avatarPicker = document.getElementById('avatarPicker');
    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    avatarPicker.addEventListener('click', () => {
      currentFaceIdx = (currentFaceIdx + 1) % faces.length;
      avatarImg.src = faces[currentFaceIdx];
      showToast('Avatar alterado!');
    });

    document.getElementById('btnQuickPlay').addEventListener('click', () => {
      showToast('Buscando adversário online... Conectando!');
    });

    document.getElementById('btnCreatePrivate').addEventListener('click', () => {
      const room = Math.floor(100000 + Math.random() * 900000);
      const url = `${window.location.origin}/?sala=${room}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast(`Sala #${room} criada! Link copiado para envio`);
      });
    });

    const codeModal = document.getElementById('codeModal');
    document.getElementById('btnJoinTicket').addEventListener('click', () => {
      codeModal.classList.add('active');
      document.getElementById('ticketCodeInput').focus();
    });

    document.getElementById('btnCancelModal').addEventListener('click', () => {
      codeModal.classList.remove('active');
    });

    document.getElementById('btnConfirmCode').addEventListener('click', () => {
      const code = document.getElementById('ticketCodeInput').value.trim();
      if (code.length === 6) {
        codeModal.classList.remove('active');
        showToast(`Entrando na sala #${code}...`);
      } else {
        showToast('Digite os 6 números');
      }
    });

    function startWithTheme(themeName) {
      showToast(`Iniciando sala com o baralho: ${themeName}!`);
    }
  </script>
</body>
</html>
